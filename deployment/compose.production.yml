services:
  finops-dashboard:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: aws-finops-control-center:production
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      FINOPS_MODE: "${FINOPS_MODE:-demo}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      FINOPS_LOG_LEVEL: "${FINOPS_LOG_LEVEL:-INFO}"
      FINOPS_DATA_DIR: "${FINOPS_DATA_DIR:-/app/data}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r dashboard/requirements.txt
          python -m pip install "pytest>=8,<9"

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run test suite
        run: python -m pytest -q

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production container
        run: docker build -f deployment/Dockerfile -t aws-finops-control-center:ci .

      - name: Inspect container user
        run: |
          test "$(docker run --rm aws-finops-control-center:ci id -u)" != "0"

      - name: Verify image metadata
        run: docker image inspect aws-finops-control-center:ci >/dev/null

      - name: Smoke test operational endpoints
        run: |
          docker run -d --name finops-ci -p 8080:8080 -p 8501:8501 aws-finops-control-center:ci
          trap 'docker logs finops-ci || true; docker rm -f finops-ci || true' EXIT
          python - <<'PY'
          import time
          import urllib.request

          for _ in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=2) as response:
                      assert response.status == 200
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("health endpoint did not become ready")

          with urllib.request.urlopen("http://127.0.0.1:8080/readiness", timeout=2) as response:
              assert response.status == 200
          with urllib.request.urlopen("http://127.0.0.1:8080/metrics", timeout=2) as response:
              body = response.read().decode()
              assert "finops_events_total" in body
          PY
